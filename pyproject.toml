[project]
name = "open-webui"
description = "Open WebUI"
authors = [
    { name = "Timothy Jaeryang Baek", email = "tim@openwebui.com" }
]
license = { file = "LICENSE" }
dependencies = [
    "fastapi==0.136.3",
    "uvicorn==0.51.0",
    "uvloop==0.22.1",
    "httptools==0.8.0",
    "websockets==17.1",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "itsdangerous==2.2.0",
    "python-socketio==5.16.2",
    "orjson==3.11.9",
    "cryptography==48.0.0",
    "bcrypt==5.0.0",
    "argon2-cffi==25.1.0",
    "PyJWT[crypto]==2.13.0",
    "authlib==1.7.2",
    "joserfc==1.7.4",
    "requests==2.34.2",
    "httpx==0.28.1",
    "aiohttp==3.13.5",
    "aiocache==0.12.3",
    "aiofiles==25.1.0",
    "starlette-compress==1.7.1",
    "Brotli==1.2.0",
    "starsessions==2.2.1",
    "sqlalchemy[asyncio]==2.0.50",
    "aiosqlite==0.22.1",
    "alembic==1.18.4",
    "loguru==0.7.3",
]
readme = "README.md"
requires-python = ">= 3.11, < 3.13.0a1"
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia",
]

[project.optional-dependencies]
# Opt-in feature dependencies. The default install is SQLite-only.
postgres = ["psycopg[binary]==3.3.4"]
redis = ["redis==8.0.1", "hiredis==3.4.0"]
azure = ["azure-identity==1.25.3"]
ldap = ["ldap3==2.9.1"]
cli = ["typer==0.25.1"]
pdf = ["fpdf2==2.8.7"]
code-format = ["black==26.5.1"]
pillow = ["pillow==12.2.0"]
all = [
    "psycopg[binary]==3.3.4",
    "redis==8.0.1",
    "hiredis==3.4.0",
    "azure-identity==1.25.3",
    "ldap3==2.9.1",
    "typer==0.25.1",
    "fpdf2==2.8.7",
    "black==26.5.1",
    "pillow==12.2.0",
]

[project.scripts]
open-webui = "open_webui:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "package.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.build.hooks.custom]  # keep this for reading hooks from `hatch_build.py`

[tool.hatch.build.targets.wheel]
sources = ["backend"]
exclude = [
    ".dockerignore",
    ".gitignore",
    ".webui_secret_key",
    "dev.sh",
    "requirements.txt",
    "start.sh",
    "start_windows.bat",
    "webui.db",
    "chroma.sqlite3",
]
force-include = { "CHANGELOG.md" = "open_webui/CHANGELOG.md", build = "open_webui/frontend" }

[tool.codespell]
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = '.git*,*.svg,package-lock.json,i18n,*.lock,*.css,*-bundle.js,locales,example-doc.txt,emoji-shortcodes.json'
check-hidden = true
# ignore-regex = ''
ignore-words-list = 'ans'

[dependency-groups]
dev = [
    "pytest-asyncio>=1.0.0",
    "ruff>=0.15.5",
    # Dev-only extras for `uvicorn --reload` / .env loading.
    "watchfiles>=1.0.0",
    "python-dotenv>=1.0.0",
]

[tool.black]
line-length = 120
skip-string-normalization = true

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/open_webui/test"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = false

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "UP",   # pyupgrade
  "C90",  # mccabe
  "Q",    # flake8-quotes
  "ICN",  # flake8-import-conventions
]

# Plugin configs:
flake8-import-conventions.banned-from = [ "ast", "datetime" ]
flake8-import-conventions.aliases = { datetime = "dt" }
flake8-quotes.inline-quotes = "single"
mccabe.max-complexity = 10
pydocstyle.convention = "google"
