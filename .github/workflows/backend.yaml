# ─────────────────────────────────────────────────────────────────────────────
# Backend CI — Ruff checks and the Pure unit tests
# Runs on pushes and PRs to main when backend files change
# ─────────────────────────────────────────────────────────────────────────────
name: Backend CI

on:
  push:
    branches: [main]
    paths: ['backend/**', 'pyproject.toml', 'uv.lock', '.github/workflows/backend.yaml']
  pull_request:
    branches: [main]
    paths: ['backend/**', 'pyproject.toml', 'uv.lock', '.github/workflows/backend.yaml']

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Ruff formatting and logic-error checks ───────────────────────────────
  format-check:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install formatter
        run: pip install "ruff>=0.15.5"

      - name: Verify formatting
        run: ruff format --check . --exclude .venv --exclude venv

      - name: Detect logic errors
        run: ruff check --select=F --ignore=F401,F403,F405,F541,F811,F841 --output-format=github .

  # ── Unit tests (SSRF hardening, compression negotiation, changelog) ──────
  tests:
    name: Unit Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install default (SQLite-only) dependencies
        run: pip install -r backend/requirements-min.txt pytest pytest-asyncio

      - name: Run the Pure test suite
        run: PYTHONPATH=backend pytest backend/open_webui/test -q
        env:
          WEBUI_SECRET_KEY: ci-test-key
