# ─────────────────────────────────────────────────────────────────────────────
# Pure image — test, then build amd64/arm64 and push a multi-arch manifest
# to GHCR (ghcr.io/<owner>/open-webui-pure).
#
# Optional Docker Hub mirror: set the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# repository secrets and the same manifest is copied to
# docker.io/<DOCKERHUB_USERNAME>/open-webui-pure (override the repository name
# with the DOCKERHUB_REPOSITORY repository variable). Without the secrets the
# mirror step is skipped and only GHCR is published.
#
# Triggers: version tags (v*) and manual dispatch. No CUDA/Ollama/slim
# variants, no upstream Helm automation.
# ─────────────────────────────────────────────────────────────────────────────
name: Pure Image

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: pure-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Backend & frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Backend tests
        run: |
          pip install -r backend/requirements-min.txt pytest pytest-asyncio
          PYTHONPATH=backend pytest backend/open_webui/test -q
        env:
          WEBUI_SECRET_KEY: ci-test-key

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Frontend tests
        run: |
          npm ci --force
          npm run test:frontend

  build:
    name: Build ${{ matrix.arch }}
    needs: [test]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare environment
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=git-
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            BUILD_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish manifest
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
    env:
      # Empty unless the repository secrets are configured; the Docker Hub
      # steps below are skipped in that case.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=git-
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ github.repository }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.meta.outputs.version }}

      # ── Optional Docker Hub mirror ─────────────────────────────────────────
      # The manifest is copied registry-side from GHCR, so the image is still
      # built only once. Skipped entirely when DOCKERHUB_USERNAME is not set.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the manifest to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        env:
          # Repository name under the Docker Hub account (no namespace prefix).
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY || 'open-webui-pure' }}
        run: |
          set -euo pipefail

          while IFS= read -r src; do
            tag="${src##*:}"
            dst="docker.io/${DOCKERHUB_USERNAME}/${DOCKERHUB_REPOSITORY}:${tag}"
            echo "Copying ${src} -> ${dst}"

            for attempt in 1 2 3; do
              if docker buildx imagetools create -t "$dst" "$src"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Failed to copy ${dst} after ${attempt} attempts"
                exit 1
              fi
              echo "Attempt ${attempt} failed; retrying in 15s..."
              sleep 15
            done
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")

          docker buildx imagetools inspect "docker.io/${DOCKERHUB_USERNAME}/${DOCKERHUB_REPOSITORY}:${{ steps.meta.outputs.version }}"
